<!doctype html>
<!-- Template for the social-sharing image (1200 x 630).
     Rendered to public/og-de.jpg and public/og-en.jpg by scripts/make-brand-assets.mjs.
     Open with ?lang=en for the English version. -->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Inter Tight';
        font-weight: 100 900;
        src: url('../node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2') format('woff2');
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px;
        background: #09090b;
        color: #f5f5f2;
        font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Same ribbon treatment as the hero section of the website. */
      .ribbon {
        position: absolute;
        left: -20%;
        width: 140%;
        border-radius: 50%;
        filter: blur(70px);
      }

      .ribbon--a {
        top: 44%;
        height: 36%;
        background: linear-gradient(90deg, #c026d3, #7c3aed 45%, transparent 85%);
        opacity: 0.7;
        transform: rotate(-9deg);
      }

      .ribbon--b {
        top: 66%;
        height: 34%;
        background: linear-gradient(90deg, transparent 10%, #4c1d95 45%, #7c3aed 80%);
        opacity: 0.7;
        transform: rotate(7deg);
      }

      .ribbon--c {
        top: 82%;
        height: 22%;
        background: linear-gradient(90deg, #2f5bff, transparent 60%);
        opacity: 0.35;
        transform: rotate(-4deg);
      }

      header,
      main {
        position: relative;
      }

      header img {
        display: block;
        height: 76px;
        width: auto;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 22px;
        color: #e4ff00;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: '';
        width: 40px;
        height: 2px;
        background: currentColor;
      }

      h1 {
        text-wrap: balance;
        font-size: 92px;
        font-weight: 700;
        line-height: 0.98;
        letter-spacing: -0.045em;
      }
    </style>
  </head>
  <body>
    <span class="ribbon ribbon--a"></span>
    <span class="ribbon ribbon--b"></span>
    <span class="ribbon ribbon--c"></span>

    <header><img src="../public/logo.png" alt="Forma Studio" /></header>

    <main>
      <p class="eyebrow" data-text="eyebrow"></p>
      <h1 data-text="title"></h1>
    </main>

    <script>
      // Texts match the hero headline of the website in each language.
      const texts = {
        de: { eyebrow: 'Webdesign · Schweiz', title: 'Websites für Firmen mit Ambitionen' },
        en: { eyebrow: 'Web design · Switzerland', title: 'Websites for businesses with ambition' },
      };
      const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'de';
      document.documentElement.lang = lang;
      for (const el of document.querySelectorAll('[data-text]')) el.textContent = texts[lang][el.dataset.text];
    </script>
  </body>
</html>
